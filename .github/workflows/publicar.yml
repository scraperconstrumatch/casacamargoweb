name: Publicar Casa Camargo
on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe PUBLICAR para actualizar casacamargo.cl'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: casa-camargo-produccion
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main' && inputs.confirmacion == 'PUBLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publicar únicamente index.html por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy.py
